<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SynapseNest Proof</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="proof-page">
    <a class="brand" href="/">✦ synapse<span>nest</span></a>
    <p class="eyebrow">PUBLIC PROJECT PROOF</p>
    <h1 id="proofTitle">Loading proof…</h1>
    <p id="proofDescription">Verifying this published Project Genome.</p>
    <section id="proofCard" class="proof-card" hidden>
      <p class="eyebrow">PUBLISHED SYNAPSE</p>
      <h2 id="synapseName"></h2>
      <p id="synapseNote"></p>
      <dl><div><dt>Project</dt><dd id="projectName"></dd></div><div><dt>Published</dt><dd id="publishedAt"></dd></div></dl>
    </section>
    <p id="proofError" class="error-message" hidden></p>
  </main>
  <script src="/proof.js" defer></script>
</body>
</html>
