<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SynapseNest Proof</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="proof-page">
    <a class="brand" href="/">✦ synapse<span>nest</span></a>
    <p class="eyebrow">PUBLIC PROJECT PROOF</p>
    <h1 id="proofTitle">Loading proof…</h1>
    <p id="proofDescription">Verifying sealed identity and lineage.</p>
    <section id="proofCard" class="proof-card" hidden>
      <p class="eyebrow">SEALED MISSION</p>
      <h2 id="missionText"></h2>
      <dl>
        <div><dt>Contract</dt><dd id="contractId"></dd></div>
        <div><dt>Guardian</dt><dd id="guardianFp"></dd></div>
        <div><dt>Genome</dt><dd id="projectName"></dd></div>
        <div><dt>Synapse</dt><dd id="synapseName"></dd></div>
        <div><dt>Runtime</dt><dd id="runtimeText"></dd></div>
      </dl>
      <p id="hardwareNote" class="eyebrow"></p>
    </section>
    <p id="proofError" class="error-message" hidden></p>
  </main>
  <script src="/proof.js" defer></script>
</body>
</html>
