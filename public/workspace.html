<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c0d10">
  <title>SynapseNest</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/workspace.css">
</head>
<body class="workspace-page">
  <div class="shell workspace-shell">
    <aside>
      <a class="brand" href="/">synapsenest</a>
      <div class="side-title">Workspaces <button id="newWorkspace" type="button" aria-label="New workspace">＋</button></div>
      <nav id="workspaceList"></nav>
      <small id="ownerState">● Owner session required</small>
    </aside>
    <main>
      <header>
        <button id="menu" type="button" aria-label="Menu">☰</button>
        <div class="crumb">workspace <b>/</b> <strong id="crumb">sign in</strong></div>
        <span class="local">● local</span>
        <a class="quiet" href="/">Genomes</a>
        <button id="logout" class="quiet" type="button" hidden>Log out</button>
      </header>

      <section id="authPanel">
        <p class="eyebrow" id="authEyebrow">Sign in</p>
        <h1 id="authTitle">Owner password</h1>
        <p id="authCopy">Required for Docker workspaces, terminal, and Grok edits.</p>
        <form id="authForm">
          <label>Password <input id="password" name="password" type="password" required minlength="10" autocomplete="current-password"></label>
          <div class="actions">
            <button class="primary" id="authSubmit" type="submit">Continue</button>
          </div>
        </form>
      </section>

      <section id="workspaceStudio" hidden>
        <div class="workspace-toolbar">
          <div>
            <p class="eyebrow">Workspace</p>
            <h1 id="workspaceTitle">static-site</h1>
            <p id="workspaceMeta">stopped</p>
          </div>
          <div class="workspace-actions">
            <button id="start" class="primary" type="button">Start</button>
            <button id="stop" class="quiet" type="button">Stop</button>
            <button id="snapshot" class="quiet" type="button">Snapshot</button>
            <button id="exportWorkspace" class="quiet" type="button">Export</button>
            <button id="save" class="quiet" type="button">Save</button>
          </div>
        </div>
        <div class="pane-switch" role="tablist">
          <button type="button" data-pane="files" class="active">Files</button>
          <button type="button" data-pane="editor">Editor</button>
          <button type="button" data-pane="preview">Preview</button>
          <button type="button" data-pane="chat">AI</button>
          <button type="button" data-pane="terminal">Terminal</button>
        </div>
        <div class="workspace-grid">
          <section class="pane files-pane" data-pane-panel="files">
            <p class="eyebrow">FILES</p>
            <div id="fileTree"></div>
          </section>
          <section class="pane editor-pane" data-pane-panel="editor">
            <p class="eyebrow" id="editorLabel">EDITOR</p>
            <textarea id="editor" spellcheck="false"></textarea>
          </section>
          <section class="pane preview-pane" data-pane-panel="preview">
            <p class="eyebrow">PREVIEW</p>
            <iframe id="preview" title="Workspace preview" sandbox="allow-scripts allow-forms" referrerpolicy="no-referrer"></iframe>
          </section>
          <section class="pane chat-pane" data-pane-panel="chat">
            <p class="eyebrow">Grok</p>
            <div id="chatLog"></div>
            <form id="chatForm">
              <textarea id="chatInput" maxlength="8000" placeholder="Build a landing page, restyle the colors, add a second section…"></textarea>
              <button class="primary" id="chatSend" type="submit">Send</button>
            </form>
            <p id="aiStatus" class="ai-status">Checking SpaceXAI…</p>
          </section>
          <section class="pane terminal-pane" data-pane-panel="terminal">
            <p class="eyebrow">TERMINAL</p>
            <pre id="terminal"></pre>
            <input id="terminalInput" type="text" autocomplete="off" spellcheck="false" placeholder="Command, then Enter">
          </section>
        </div>
      </section>
    </main>
  </div>
  <div id="toast"></div>
  <script src="/workspace.js" defer></script>
</body>
</html>
